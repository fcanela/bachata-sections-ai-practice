<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bachata sections</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="top">
      <h1>Bachata sections</h1>
      <div id="title" class="title" hidden>
        <h2 id="song-name"></h2>
        <button id="rename-open" class="quiet" type="button">Rename</button>
      </div>
      <div class="add">
        <p id="message" role="status"></p>
        <progress id="sending" max="1" hidden aria-label="Sending the song"></progress>
        <input id="file" class="hidden-input" type="file" accept=".mp3,.m4a,.opus,audio/mpeg,audio/mp4,audio/ogg,audio/opus">
        <label class="button primary" for="file" title="Choose an mp3, m4a or opus file">Add a song</label>
      </div>
    </header>

    <nav class="rail" aria-labelledby="songs-heading">
      <h2 id="songs-heading">Songs</h2>
      <p id="empty">No song yet.</p>
      <ul id="songs"></ul>
    </nav>

    <main>
      <div id="nothing" class="nothing">
        <p id="nothing-text" role="status"></p>
      </div>

      <section id="player" class="player" aria-labelledby="song-name" hidden>
        <div class="now">
          <p class="figure">
            <output id="count" aria-label="Count">–</output>
            <span class="under"><span class="tempo"><span id="bpm">–</span> <span class="unit">BPM</span></span> <span id="position">0:00</span></span>
          </p>
          <canvas id="now" aria-label="The ocho that is sounding, with a place for each count. The beat that is sounding is lit. Press a beat to move the playing position there."></canvas>
        </div>
        <div id="song" class="song">
          <div id="song-size">
            <canvas id="map" aria-label="The song in rows of ochos, a plate for each bar with its count on it. Press a bar to move the playing position to its first beat. Drag across bars to mark them as a loop."></canvas>
          </div>
        </div>
      </section>

      <footer class="transport">
        <button id="play" class="primary" type="button" disabled>Play</button>
        <div class="position">
          <span id="seek-loop" aria-hidden="true" hidden></span>
          <input id="seek" type="range" min="0" max="1" step="any" value="0" disabled aria-label="Position in the song">
        </div>
        <p id="duration" class="time" title="Length of the song">0:00</p>
        <div class="loop" role="group" aria-labelledby="loop-label">
          <div class="marked">
            <label class="switch"><input id="loop" type="checkbox" disabled> <span id="loop-label">Loop</span></label>
            <span id="loop-range" class="range">Drag across bars</span>
          </div>
          <button id="loop-start" type="button" disabled>Start here</button>
          <button id="loop-end" type="button" disabled>End here</button>
          <button id="loop-clear" type="button" disabled title="Take the marked range away">Clear</button>
        </div>
        <div class="counting">
          <button id="one" type="button" disabled title="Say that the beat at the playing position is count 1">Count 1 here</button>
          <span id="one-note" class="note refused" role="status"></span>
        </div>
        <label class="switch"><input id="click" type="checkbox" checked> Click on every beat</label>
      </footer>
    </main>
  </body>
</html>
